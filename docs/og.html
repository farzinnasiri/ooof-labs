<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Ooof Labs social image artwork</title>
    <script type="module">
      import "/src/style.css";
    </script>
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #203fe3;
        color: #fff6df;
      }
      .social {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 43px 58px;
      }
      .brand-mark {
        width: 145px;
      }
      .brand-labs {
        font-size: 21px;
      }
      .social h1 {
        font-size: 86px;
        line-height: 1;
        letter-spacing: -0.04em;
        margin-top: 37px;
      }
      .social .founders {
        width: 480px;
        position: absolute;
        left: 58px;
        bottom: 47px;
      }
      .social .founder {
        width: 36%;
      }
      .social .portrait-ring {
        border-width: 20px;
      }
      .social-note {
        position: absolute;
        left: 655px;
        bottom: 92px;
        width: 460px;
        font-size: 27px;
        line-height: 1.35;
        letter-spacing: -0.02em;
      }
      .social-url {
        position: absolute;
        right: 58px;
        top: 54px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="social">
      <span class="brand"
        ><svg class="brand-mark" viewBox="0 0 162 52">
          <g fill="none" stroke="currentColor" stroke-width="9">
            <ellipse cx="24" cy="30" rx="17" ry="17" />
            <ellipse cx="63" cy="30" rx="17" ry="17" />
            <ellipse cx="102" cy="30" rx="17" ry="17" />
            <path d="M134 47V17q0-12 14-12h7M122 23h32" />
          </g></svg
        ><span class="brand-labs">labs</span></span
      ><span class="social-url">oooflabs.vercel.app</span>
      <h1>AI belongs in<br />the everyday.</h1>
      <div class="founders">
        <div class="founder founder-farzin">
          <span class="portrait-ring"
            ><span class="portrait-window"
              ><img
                class="founder-image"
                src="/images/founders-studio.webp"
                width="1536"
                height="1024"
                alt="Farzin Nasiri"
                style="--panel: 0" /></span
          ></span>
        </div>
        <div class="founder founder-ali">
          <span class="portrait-ring"
            ><span class="portrait-window"
              ><img
                class="founder-image"
                src="/images/founders-studio.webp"
                width="1536"
                height="1024"
                alt="Alireza Kebriaei"
                style="--panel: 1" /></span
          ></span>
        </div>
        <div class="founder founder-yazdan">
          <span class="portrait-ring"
            ><span class="portrait-window"
              ><img
                class="founder-image"
                src="/images/founders-studio.webp"
                width="1536"
                height="1024"
                alt="Yazdan"
                style="--panel: 2" /></span
          ></span>
        </div>
      </div>
      <p class="social-note">We help companies<br />become AI native.</p>
    </div>
  </body>
</html>
