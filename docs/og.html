<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Ooof Labs social artwork</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .social {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 42px 58px;
        background: var(--canvas);
        color: var(--ink);
      }
      .social .brand-mark {
        width: 145px;
      }
      .social h1 {
        font-size: 86px;
        line-height: 1;
        margin-top: 34px;
      }
      .social .founders {
        --o-size: 172px;
        position: absolute;
        left: 58px;
        bottom: 45px;
        width: 620px;
      }
      .social-note {
        position: absolute;
        left: 785px;
        bottom: 105px;
        width: 350px;
        font-size: 27px;
        line-height: 1.35;
        letter-spacing: -0.02em;
      }
      .social-url {
        position: absolute;
        right: 58px;
        top: 57px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="social">
      <span class="brand" role="img" aria-label="Ooof Labs"
        ><svg class="brand-mark" viewBox="0 0 162 52" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="9">
            <ellipse cx="24" cy="30" rx="17" ry="17" />
            <ellipse cx="63" cy="30" rx="17" ry="17" />
            <ellipse cx="102" cy="30" rx="17" ry="17" />
            <path d="M134 47V17q0-12 14-12h7M122 23h32" />
          </g></svg
        ><span class="brand-labs" aria-hidden="true">labs</span></span
      ><span class="social-url">oooflabs.vercel.app</span>
      <h1>AI belongs in<br />the everyday.</h1>
      <div class="brand-stage founders">
        <div class="founder founder-farzin">
          <span class="portrait-ring"
            ><span class="portrait-window"
              ><img
                class="founder-image"
                src="/images/founders-studio-v2.webp"
                width="1536"
                height="1024"
                alt="Farzin Nasiri"
                style="--panel: 0" /></span
          ></span>
        </div>
        <div class="founder founder-ali">
          <span class="portrait-ring"
            ><span class="portrait-window"
              ><img
                class="founder-image"
                src="/images/founders-studio-v2.webp"
                width="1536"
                height="1024"
                alt="Alireza Kebriaei"
                style="--panel: 1" /></span
          ></span>
        </div>
        <div class="founder founder-yazdan">
          <span class="portrait-ring"
            ><span class="portrait-window"
              ><img
                class="founder-image"
                src="/images/founders-studio-v2.webp"
                width="1536"
                height="1024"
                alt="Yazdan Zandiyevakili"
                style="--panel: 2" /></span
          ></span>
        </div>
        <div class="founder-f">
          <svg viewBox="121 8.5 35 43" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="5.6">
              <path d="M134 48V18q0-11 13-11h9" />
              <path d="M121 24.5h32" />
            </g>
          </svg>
        </div>
      </div>
      <p class="social-note">We help companies<br />become AI native.</p>
    </div>
  </body>
</html>
